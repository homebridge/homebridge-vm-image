kernel:
  image: linuxkit/kernel:6.6.71
  cmdline: "console=tty0 console=ttyS0 console=ttyAMA0"

init:
  - linuxkit/init:680da6e6f79bb8236a095147d532cd2160e23c9f
  - linuxkit/runc:2dfee46421e963d6c0d946137e46fe36fa606d29
  - linuxkit/containerd:838b745e38e43309393675ce3cf04bee9047eb91

onboot:
  - name: format-and-mount
    image: alpine:3.18
    command: ["/bin/sh", "-c", "
      if [ -b /dev/sdb ]; then
        echo '/dev/sdb found, using it for /var/lib/homebridge';
        blkid /dev/sdb || mkfs.ext4 /dev/sdb;
        mkdir -p /var/lib/homebridge;
        mount /dev/sdb /var/lib/homebridge;
        chown 1000:1000 /var/lib/homebridge;
        echo '/dev/sdb /var/lib/homebridge ext4 defaults 0 2' >> /etc/fstab;
        echo 'Mounted /dev/sdb on /var/lib/homebridge:';
      else
        echo 'ERROR: /dev/sdb not found, using tmpfs for /var/lib/homebridge';
        mkdir -p /var/lib/homebridge;
        mount -t tmpfs tmpfs /var/lib/homebridge;
        chown 1000:1000 /var/lib/homebridge;
      fi
    "]
  - name: dhcpcd
    image: linuxkit/dhcpcd:4681273eeea47c26d980958656e60fe70d49e318
    command: ["/sbin/dhcpcd", "--nobackground", "-f", "/dhcpcd.conf", "-1"]

services:
  - name: getty
    image: linuxkit/getty:37a16fb37f56ad0aee6532c1a39d780416f7fb80
    env:
     - INSECURE=true

  - name: vbox-guest-additions
    image: alpine:3.18
    command: ["/bin/sh", "-c", "apk add --no-cache virtualbox-guest-additions virtualbox-guest-modules-lts dbus && modprobe vboxguest && modprobe vboxsf && modprobe vboxvideo && exec VBoxService --foreground"]
    capabilities:
      - all
    binds:
      - /dev:/dev
      - /sys:/sys
      - /proc:/proc
    pid: host

  - name: homebridge
    image: alpine:3.18
    command: ["/bin/sh", "-c", "apk add --no-cache nodejs npm python3 py3-pip build-base linux-headers avahi-dev dbus-dev && npm install -g --unsafe-perm homebridge homebridge-config-ui-x && mkdir -p /homebridge && if [ ! -f /homebridge/config.json ]; then echo '{\"bridge\":{\"name\":\"Homebridge\",\"username\":\"CC:22:3D:E3:CE:30\",\"port\":51826,\"pin\":\"031-45-154\"},\"accessories\":[],\"platforms\":[{\"name\":\"Config\",\"port\":8581,\"platform\":\"config\"}]}' > /homebridge/config.json; fi && cd /homebridge && exec homebridge -U /homebridge"]
    binds:
      - /var/lib/homebridge:/homebridge
    net: host

  - name: avahi
    image: alpine:3.18
    command: ["/bin/sh", "-c", "apk add --no-cache avahi avahi-tools dbus && mkdir -p /var/run/dbus && dbus-daemon --system --fork && exec avahi-daemon --no-drop-root"]
    net: host
    pid: host

files:
  - path: /etc/avahi/services/homebridge.service
    contents: |
      <?xml version="1.0" standalone='no'?><!--*-nxml-*-->
      <!DOCTYPE service-group SYSTEM "avahi-service.dtd">
      <service-group>
        <name replace-wildcards="yes">%h</name>
        <service>
          <type>_hap._tcp</type>
          <port>51826</port>
          <txt-record>md=Homebridge</txt-record>
          <txt-record>pv=1.1</txt-record>
          <txt-record>id=CC:22:3D:E3:CE:30</txt-record>
          <txt-record>c#=1</txt-record>
          <txt-record>s#=1</txt-record>
          <txt-record>ff=0</txt-record>
          <txt-record>ci=2</txt-record>
          <txt-record>sf=1</txt-record>
        </service>
      </service-group>