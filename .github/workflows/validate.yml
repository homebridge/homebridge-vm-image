---
name: Validate VM Images

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install VirtualBox or Hyper-V (architecture-specific)
        timeout-minutes: 10
        run: |
          if ("${{ matrix.arch }}" -eq "amd64") {
            # Download and install VirtualBox for AMD64
            $url = "https://download.virtualbox.org/virtualbox/7.0.20/VirtualBox-7.0.20-163906-Win.exe"
            $output = "$env:TEMP\VirtualBox-installer.exe"
            Write-Host "Downloading VirtualBox..."
            Invoke-WebRequest -Uri $url -OutFile $output
            Write-Host "Downloaded VirtualBox installer"
            
            # Check installer help first
            Write-Host "Checking VirtualBox installer options..."
            try {
              $helpOutput = & $output --help 2>&1
              Write-Host "Installer help output: $helpOutput"
            } catch {
              Write-Host "Could not get installer help: $_"
            }
            
            # Install VirtualBox with timeout and better error handling
            Write-Host "Installing VirtualBox (this may take a few minutes)..."
            $process = Start-Process -FilePath $output -ArgumentList "--silent" -PassThru -Wait
            if ($process.ExitCode -eq 0) {
              Write-Host "VirtualBox installed successfully"
            } else {
              Write-Host "VirtualBox installation failed with exit code: $($process.ExitCode)"
              Write-Host "Trying alternative installation method..."
              # Try with /quiet instead of --silent
              $process2 = Start-Process -FilePath $output -ArgumentList "/quiet" -PassThru -Wait
              if ($process2.ExitCode -eq 0) {
                Write-Host "VirtualBox installed successfully with /quiet parameter"
              } else {
                Write-Host "VirtualBox installation failed with both methods. Exit codes: $($process.ExitCode), $($process2.ExitCode)"
                exit 1
              }
            }
            
            # Add VirtualBox to PATH and refresh environment
            $vboxPath = "${env:ProgramFiles}\Oracle\VirtualBox"
            Write-Host "Adding VirtualBox to PATH: $vboxPath"
            
            # Check if installation directory exists
            if (Test-Path $vboxPath) {
              Write-Host "VirtualBox installation directory found: $vboxPath"
              $env:PATH += ";$vboxPath"
              [Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Machine")
              
              # Force refresh the current session PATH
              $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH","User")
              Write-Host "Updated PATH environment variable"
            } else {
              Write-Host "VirtualBox installation directory not found at: $vboxPath"
              # Try alternative locations
              $altPaths = @(
                "${env:ProgramFiles(x86)}\Oracle\VirtualBox",
                "C:\Program Files\Oracle\VirtualBox",
                "C:\Program Files (x86)\Oracle\VirtualBox"
              )
              foreach ($altPath in $altPaths) {
                if (Test-Path $altPath) {
                  Write-Host "Found VirtualBox at alternative location: $altPath"
                  $env:PATH += ";$altPath"
                  [Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Machine")
                  $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH","User")
                  $vboxPath = $altPath
                  break
                }
              }
            }
            Write-Host "Final VirtualBox path: $vboxPath"
            
            # Verify VBoxManage is accessible
            Write-Host "Verifying VBoxManage accessibility..."
            try {
              $vboxVersion = & VBoxManage --version 2>&1
              Write-Host "VBoxManage version: $vboxVersion"
            } catch {
              Write-Host "VBoxManage still not accessible, trying direct path..."
              $vboxManagePath = Join-Path $vboxPath "VBoxManage.exe"
              if (Test-Path $vboxManagePath) {
                Write-Host "Found VBoxManage at: $vboxManagePath"
                $env:PATH = "$vboxPath;$env:PATH"
                Write-Host "Prepended VirtualBox path to beginning of PATH"
              } else {
                Write-Host "VBoxManage.exe not found at expected location: $vboxManagePath"
                Get-ChildItem -Path $vboxPath -Filter "*.exe" | Write-Host
              }
            }
          } else {
            # For ARM64, enable Hyper-V (VirtualBox has limited ARM64 support)
            Write-Host "Enabling Hyper-V for ARM64..."
            Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All -All -NoRestart
            Write-Host "Enabled Hyper-V for ARM64"
          }

      - name: Install additional tools for ARM64 (if needed)
        if: matrix.arch == 'arm64'
        run: |
          # Install disk conversion tools for Hyper-V
          # Note: For ARM64, we might need to convert raw disk images to VHD format
          Write-Host "Installing additional tools for ARM64 validation..."

      - name: Verify virtualization platform
        shell: pwsh
        run: |
          if ("${{ matrix.arch }}" -eq "amd64") {
            # Re-verify VBoxManage is accessible and add to GitHub PATH
            $vboxPath = "${env:ProgramFiles}\Oracle\VirtualBox"
            if (-not (Test-Path $vboxPath)) {
              $altPaths = @(
                "${env:ProgramFiles(x86)}\Oracle\VirtualBox",
                "C:\Program Files\Oracle\VirtualBox",
                "C:\Program Files (x86)\Oracle\VirtualBox"
              )
              foreach ($altPath in $altPaths) {
                if (Test-Path $altPath) {
                  $vboxPath = $altPath
                  break
                }
              }
            }
            
            Write-Host "Final VirtualBox path: $vboxPath"
            # Add to GitHub PATH for subsequent steps
            echo "$vboxPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            
            # Verify VBoxManage works
            $vboxManagePath = Join-Path $vboxPath "VBoxManage.exe"
            if (Test-Path $vboxManagePath) {
              $version = & "$vboxManagePath" --version
              Write-Host "VBoxManage version: $version"
            } else {
              Write-Host "ERROR: VBoxManage.exe not found at $vboxManagePath"
              exit 1
            }
          } else {
            Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V-All
          }

      - name: Check for existing VM image
        id: check-image
        run: |
          New-Item -ItemType Directory -Path "output" -Force
          # Try to download from latest release first
          $releaseUrl = "https://github.com/homebridge/homebridge-vm-image/releases/download/v0.0.1/homebridge-${{ matrix.arch }}.img.gz"
          try {
            Invoke-WebRequest -Uri $releaseUrl -OutFile "output\homebridge-${{ matrix.arch }}.img.gz" -ErrorAction Stop
            Write-Host "Downloaded VM image from release"
            Write-Output "image_source=release" >> $env:GITHUB_OUTPUT
          } catch {
            Write-Host "No existing VM image found. Building for validation..."
            Write-Output "image_source=build" >> $env:GITHUB_OUTPUT
          }

      - name: Build VM image for validation
        if: steps.check-image.outputs.image_source == 'build'
        run: |
          # Install WSL2 and required tools for building
          wsl --install --no-distribution
          # Note: This would require a reboot in normal circumstances
          # For CI, we'll skip building and use existing images only
          Write-Host "Building VM images in CI not supported yet. Please ensure images exist in releases."
          exit 1

      - name: Validate VM image
        run: |
          .\validate-vm.ps1 -Architecture "${{ matrix.arch }}" -ImagePath "output\homebridge-${{ matrix.arch }}.img.gz" -Timeout 300
        timeout-minutes: 15

      - name: Upload validation logs and Homebridge logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs-${{ matrix.arch }}
          path: |
            *.log
            vm-*.txt
            homebridge-validation-*.log
          retention-days: 7
