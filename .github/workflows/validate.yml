---
name: Validate VM Images

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 qemu-system-arm \
            qemu-utils curl gzip

      - name: Check for existing VM image
        id: check-image
        run: |
          mkdir -p output
          # Try to download from latest release first
          RELEASE_URL="https://github.com/homebridge/homebridge-vm-image"
          RELEASE_URL="${RELEASE_URL}/releases/download/v0.0.1"
          RELEASE_URL="${RELEASE_URL}/homebridge-${{ matrix.arch }}.img.gz"
          if curl -L --fail "$RELEASE_URL" \
             -o "output/homebridge-${{ matrix.arch }}.img.gz" \
             2>/dev/null; then
            echo "Downloaded VM image from release"
            echo "image_source=release" >> $GITHUB_OUTPUT
          else
            echo "No existing VM image found. Building for validation..."
            echo "image_source=build" >> $GITHUB_OUTPUT
          fi

      - name: Build VM image for validation
        if: steps.check-image.outputs.image_source == 'build'
        run: |
          sudo apt-get install -y \
            debootstrap parted e2fsprogs dosfstools \
            grub-pc-bin grub-efi-amd64-bin \
            qemu-user-static gzip
          chmod +x ./build.sh
          sudo ./build.sh "${{ matrix.arch }}"

      - name: Make validation script executable
        run: chmod +x ./validate-vm.sh

      - name: Validate VM image
        run: |
          ./validate-vm.sh "${{ matrix.arch }}" \
            "output/homebridge-${{ matrix.arch }}.img.gz" 300
        timeout-minutes: 10

      - name: Upload validation logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs-${{ matrix.arch }}
          path: |
            *.log
            vm.pid
          retention-days: 7
