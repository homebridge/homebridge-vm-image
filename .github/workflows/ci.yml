name: CI

on:
  pull_request:

# no rights by default; each job asks for what it needs
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    steps:
      - name: Install shellcheck
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            bash ca-certificates dash git python3 shellcheck > /dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the checkout belongs to another user than the one the container runs as
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: shellcheck (every shell script)
        run: scripts/lint.sh

      - name: Syntax check with the shells that run the scripts
        run: |
          # hb-config and the files the Homebridge package loads are /bin/sh scripts (dash in the VM)
          dash -n assets/01-homebridge/files/hb-config
          dash -n assets/01-homebridge/files/source-vm.sh
          dash -n assets/01-homebridge/files/vm-env.sh
          dash -n assets/04-tzupdate/files/hb-timezone-once
          python3 -m py_compile scripts/boot-test-guest.py

  # actionlint checks the workflow files: YAML, expressions, and the shell lines inside them
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tool is run from its container image, named by digest (version 1.7.12).
      # To update: docker pull rhysd/actionlint:<version>, then copy the new digest.
      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo:ro --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      # hadolint checks scripts/Dockerfile (the image for local builds); named by digest (version 2.14.0)
      - name: hadolint
        run: |
          docker run --rm -i hadolint/hadolint@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e < scripts/Dockerfile

  tests:
    name: Script tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The same Debian release as the image, so sh, sed, jq and nginx behave as they do in the VM.
    # The image is named by its digest, so it can not change without a commit here.
    # To update: docker pull debian:trixie-slim, then copy the new digest.
    container:
      image: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    steps:
      - name: Install the tools the tests use
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            bash ca-certificates dash git jq nginx openssl passwd python3 python3-yaml qemu-utils > /dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the checkout belongs to another user than the one the container runs as
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run the tests
        run: tests/run.sh

  # Installs the build machine's packages on the two runner images the release build uses.
  # (In November 2026 a package that a new Ubuntu no longer had stopped every release build.)
  build-host-packages:
    name: Build machine packages (${{ matrix.arch }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runs-on: ubuntu-24.04-arm
          - arch: amd64
            runs-on: ubuntu-24.04
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the packages the image build needs
        env:
          ARCH: ${{ matrix.arch }}
        run: sudo ./scripts/install-build-deps.sh "$ARCH"
