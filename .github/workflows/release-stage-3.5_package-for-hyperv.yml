name: Release Stage 3.5 - Package for Hyper-V Appliance
run-name: Release Stage 3.5 - Package for Hyper-V - Run ${{ inputs.run_id }} - ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }} - ${{ inputs.release_stream }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Run ID of the build workflow that produced the artifacts'
        required: true
        type: string
      release_stream:
        description: 'Release stream (stable, beta, alpha)'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
        default: beta
      HOMEBRIDGE_VM_IMAGE_VERSION:
        description: 'Homebridge VM image version aka release tag'
        required: true
        type: string

concurrency:
  group: package-and-validate-hyperv
  cancel-in-progress: false

jobs:
  package-for-hyperv:
    runs-on: windows-2022
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VHDX and Manifest from Release
        run: |
          $releaseTag = "${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}"
          $arch = "${{ matrix.arch }}"
          $outputDir = "output"
          mkdir $outputDir
          $baseUrl = "https://github.com/homebridge/homebridge-vm-image/releases/download/${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}"
          $vhdxFile = "homebridge-vm-image-${{ inputs.release_stream }}-$arch.vhdx.gz"
          $manifestFile = "homebridge-vm-image-${{ inputs.release_stream }}-$arch.manifest"
          Invoke-WebRequest -Uri "$baseUrl/$vhdxFile" -OutFile "$outputDir\$vhdxFile"
          Invoke-WebRequest -Uri "$baseUrl/$manifestFile" -OutFile "$outputDir\$manifestFile"
          # Unzip the VHDX file
          Write-Host "Extracting $vhdxFile..."
          Expand-Archive -Path "$outputDir\$vhdxFile" -DestinationPath $outputDir -Force
          # If Expand-Archive fails (not a zip), use gunzip
          if (!(Test-Path "$outputDir\homebridge-vm-image-${{ inputs.release_stream }}-$arch.vhdx")) {
            Write-Host "Trying gunzip for $vhdxFile..."
            gzip -d "$outputDir\$vhdxFile"
          }

      - name: List Downloaded Artifacts
        run: dir output

      - name: Install Hyper-V PowerShell Module
        run: |
          Install-WindowsFeature -Name Hyper-V -IncludeManagementTools
          Import-Module Hyper-V

      - name: Create Hyper-V VM
        run: |
          $vmName = "homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}"
          $vhdxPath = "output\homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}.vhdx"
          New-VM -Name $vmName -MemoryStartupBytes 4096MB -Generation 2 -VHDPath $vhdxPath
          Set-VMFirmware -VMName $vmName -EnableSecureBoot Off
          Add-VMNetworkAdapter -VMName $vmName -SwitchName "Default Switch"
          Write-Host "VM $vmName created and configured."

      - name: Set VM Description (Notes)
        run: |
          $vmName = "homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}"
          $manifestPath = "output\homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}.manifest"
          if (Test-Path $manifestPath) {
            $description = Get-Content $manifestPath | Out-String
            Set-VM -Name $vmName -Notes $description
            Write-Host "Set VM description from manifest."
          } else {
            Write-Host "Manifest file not found, skipping VM description."
          }

      - name: Export Hyper-V VM
        run: |
          $vmName = "homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}"
          $exportPath = "output\$vmName-export"
          Export-VM -Name $vmName -Path $exportPs
          Compress-Archive -Path $exportPath\* -DestinationPath "output\$vmName-hyperv.zip"

      - name: Upload Hyper-V Appliance as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperv-appliance-${{ matrix.arch }}
          path: |
            output\homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}.vhdx
            output\homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}-hyperv.zip
            output\*.manifest

      - name: Upload VHDX and ZIP to GitHub Release
        run: |
          gh release upload "${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}" "output\homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}.vhdx" "output\homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}-hyperv.zip" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Packaging complete
        run: |
          echo "::notice::Homebridge VM image version: ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}"
          echo "::notice::Run ID: ${{ inputs.run_id }}"
          echo "::notice::Architecture: ${{ matrix.arch }}"
          echo "::notice::Release Stream: ${{ inputs.release_stream }}"