name: Release Stage 3.5 - Package for Hyper-V Appliance
run-name: Release Stage 3.5 - Package for Hyper-V - Run ${{ inputs.run_id }} - ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }} - ${{ inputs.release_stream }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Run ID of the build workflow that produced the artifacts'
        required: true
        type: string
      release_stream:
        description: 'Release stream (stable, beta, alpha)'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
        default: beta
      HOMEBRIDGE_VM_IMAGE_VERSION:
        description: 'Homebridge VM image version aka release tag'
        required: true
        type: string

concurrency:
  group: package-and-validate-hyperv
  cancel-in-progress: false

jobs:
  package-for-hyperv:
    runs-on: windows-2022
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download VHDX and Manifest from Release
        run: |
          $releaseTag = "${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}"
          $arch = "${{ matrix.arch }}"
          $outputDir = "output"
          mkdir $outputDir
          $baseUrl = "https://github.com/homebridge/homebridge-vm-image/releases/download/${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}"
          $vhdxFile = "homebridge-vm-image-${{ inputs.release_stream }}-$arch.vhdx.gz"
          $manifestFile = "homebridge-vm-image-${{ inputs.release_stream }}-$arch.manifest"
          Invoke-WebRequest -Uri "$baseUrl/$vhdxFile" -OutFile "$outputDir\$vhdxFile"
          Invoke-WebRequest -Uri "$baseUrl/$manifestFile" -OutFile "$outputDir\$manifestFile"
          # Unzip the VHDX file (gzip, not zip)
          Write-Host "Extracting $vhdxFile..."
          dir output
          if (Get-Command gzip -ErrorAction SilentlyContinue) {
            gzip -d "$outputDir\$vhdxFile"
          } else {
            # Use .NET for gzip decompression if gzip is not available
            $inFile = "$outputDir\$vhdxFile"
            $outFile = $inFile -replace '\.gz$', ''
            $inStream = [System.IO.File]::OpenRead($inFile)
            $outStream = [System.IO.File]::Create($outFile)
            $gzipStream = New-Object System.IO.Compression.GzipStream($inStream, [System.IO.Compression.CompressionMode]::Decompress)
            $buffer = New-Object byte[] 4096
            while (($read = $gzipStream.Read($buffer, 0, $buffer.Length)) -gt 0) {
              $outStream.Write($buffer, 0, $read)
            }
            $gzipStream.Close()
            $outStream.Close()
            $inStream.Close()
            Remove-Item $inFile
          }

      - name: List Downloaded Artifacts
        run: dir output

      - name: Install Hyper-V PowerShell Module
        run: |
          Install-WindowsFeature -Name Hyper-V -IncludeManagementTools
          Import-Module Hyper-V

      - name: Ensure Hyper-V Switch Exists
        run: |
          $switchName = "HomebridgeSwitch"
          if (-not (Get-VMSwitch -Name $switchName -ErrorAction SilentlyContinue)) {
            New-VMSwitch -Name $switchName -SwitchType Internal
          }
          Write-Host "Using switch: $switchName"

      - name: Expand VHDX to 50GB
        run: |
          $arch = "${{ matrix.arch }}"
          $vhdxPath = "output\homebridge-vm-image-${{ inputs.release_stream }}-$arch.vhdx"
          Resize-VHD -Path $vhdxPath -SizeBytes 50GB
          Write-Host "Expanded $vhdxPath to 50GB"

      - name: Create Hyper-V VM
        run: |
          $vmName = "homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}"
          $vhdxPath = "output\homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}.vhdx"
          New-VM -Name $vmName -MemoryStartupBytes 4096MB -Generation 2 -VHDPath $vhdxPath
          Set-VMFirmware -VMName $vmName -EnableSecureBoot Off
          Add-VMNetworkAdapter -VMName $vmName -SwitchName "HomebridgeSwitch"
          Write-Host "VM $vmName created and configured."

      - name: Set VM Description (Notes)
        run: |
          $vmName = "homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}"
          $manifestPath = "output\homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}.manifest"
          if (Test-Path $manifestPath) {
            $description = Get-Content $manifestPath | Out-String
            Set-VM -Name $vmName -Notes $description
            Write-Host "Set VM description from manifest."
          } else {
            Write-Host "Manifest file not found, skipping VM description."
          }

      - name: Export Hyper-V VM
        run: |
          $vmName = "homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}"
          $exportPath = "output\$vmName-export"
          Export-VM -Name $vmName -Path $exportPath
          Write-Host "Exported VM $vmName to $exportPath"

      - name: List Exported Artifacts
        run: dir output

      - name: Zip Hyper-V Export with 7-Zip
        run: |
          $vmName = "homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}"
          $exportPath = "output\$vmName-export"
          $zipPath = "output\$vmName-hyperv.zip"
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            choco install 7zip -y
          }
          & 7z a -tzip $zipPath $exportPath\*
          Write-Host "Zipped $exportPath to $zipPath"

      - name: Zip VHDX file with 7-Zip
        run: |
          $arch = "${{ matrix.arch }}"
          $releaseStream = "${{ inputs.release_stream }}"
          $vhdxPath = "output\homebridge-vm-image-$releaseStream-$arch.vhdx"
          $zipPath = "output\homebridge-vm-image-$releaseStream-$arch.vhdx.zip"
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            choco install 7zip -y
          }
          & 7z a -tzip $zipPath $vhdxPath
          Write-Host "Zipped $vhdxPath to $zipPath"

      - name: List Exported Artifacts
        run: dir output
        
      - name: Upload Hyper-V Appliance as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperv-appliance-${{ matrix.arch }}
          path: |
            output\homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}.vhdx.zip
            output\homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}-hyperv.zip
            output\*.manifest

      - name: Upload VHDX, ZIP, and HyperV ZIP to GitHub Release
        run: |
          gh release upload "${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}" `
            "output\homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}.vhdx.zip" `
            "output\homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}-hyperv.zip" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Packaging complete
        run: |
          echo "::notice::Homebridge VM image version: ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}"
          echo "::notice::Run ID: ${{ inputs.run_id }}"
          echo "::notice::Architecture: ${{ matrix.arch }}"
          echo "::notice::Release Stream: ${{ inputs.release_stream }}"