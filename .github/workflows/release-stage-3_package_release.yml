name: Release Stage 3 - Package Release 
run-name: Release Stage 3 - Package Release - Run ${{ inputs.run_id }} - ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }} - ${{ inputs.release_stream }} - ${{ inputs.run_name }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Run ID of the build workflow that produced the artifacts'
        required: true
        type: string
      release_stream:
        description: 'Release stream (stable, beta, alpha)'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
        default: beta
      HOMEBRIDGE_VM_IMAGE_VERSION:
        description: 'Homebridge VM image version aka release tag'
        required: true
        type: string
      run_name:
        description: 'Unique name of the run'
        required: false
        type: string
        default: ''

env:
  VDISK_SIZE: 50G  # Size of the virtual disk for each VM
  # The workflow inputs reach every shell line through these names, never pasted into the line.
  RELEASE_STREAM: ${{ inputs.release_stream }}
  BUILD_RUN_ID: ${{ inputs.run_id }}
  TAG: ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}
  GH_REPO: ${{ github.repository }}

concurrency:
  group: package-and-release
  cancel-in-progress: false

# No rights by default. Each job below asks for what it needs.
# Releases are written with the token of the Homebridge GitHub App, made in the job that needs
# it, right before the step that uses it.
permissions: {}

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout, and read the previous release for the release notes
      actions: read   # download the images that the Stage 2 run built
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Check Release Branch
      env:
        RELEASE_STREAM: ${{ inputs.release_stream }}
      run: |
        # Only beta and alpha may build from a pre-release branch (e.g. beta-2026.11.18).
        # Stable must come from latest, so a branch can never publish a stable release.
        if [[ "$RELEASE_STREAM" != "beta" && "$RELEASE_STREAM" != "alpha" && "$GITHUB_REF_NAME" != "latest" ]]; then
          echo "::error::${RELEASE_STREAM} releases must be built from the latest branch, not ${GITHUB_REF_NAME}"
          exit 1
        fi
        if [[ "$GITHUB_REF_NAME" != "latest" && ! "$GITHUB_REF_NAME" =~ ^${RELEASE_STREAM}-[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
          echo "::error::${RELEASE_STREAM} releases must be built from latest or a ${RELEASE_STREAM}-YYYY.M.D branch, not ${GITHUB_REF_NAME}"
          exit 1
        fi

    - name: Download Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: homebridge-image-*
        path: ./output
        run-id: ${{ inputs.run_id }}
        merge-multiple: true
        github-token: ${{ github.token }}

    - name: List Downloaded Artifacts
      run: ls -lR ./output

    - name: Install QEMU
      run: |
        echo "::group::Installing QEMU"
        sudo apt-get update
        sudo apt-get install -y qemu-utils
        echo "::endgroup::"

    - name: Set Release Title
      id: set_title
      run: |
        if [[ "$RELEASE_STREAM" == "beta" ]]; then
          echo "RELEASE_TITLE=BETA: Homebridge VM Image Release ${TAG}" >> "$GITHUB_OUTPUT"
        elif [[ "$RELEASE_STREAM" == "alpha" ]]; then
          echo "RELEASE_TITLE=ALPHA: Homebridge VM Image Release ${TAG}" >> "$GITHUB_OUTPUT"
        else
          echo "RELEASE_TITLE=Homebridge VM Image Release ${TAG}" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Release Body
      id: release_body
      run: |
        # CURRENT_TAG: on a second build of the same day the tag exists already; the notes must
        # then compare with the release before it, not with itself.
        # The branch name lets a build from a pre-release branch list what is not yet in stable.
        CURRENT_TAG="$TAG" ./scripts/create-release-body.sh "$RELEASE_STREAM" "$GITHUB_REF_NAME"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Create GitHub App Token
      id: app-token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
        private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
        owner: homebridge
        repositories: homebridge-vm-image
        permission-contents: write

    - name: Create GitHub Prerelease
      id: create_release
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        TITLE: ${{ steps.set_title.outputs.release_title }}
      run: |
        if gh release view "$TAG" >/dev/null 2>&1; then
          # A second build on the same day uses the same tag. The files of the first build stay
          # in place: every upload below, and in Stage 4, replaces one file by the new one of
          # the same name (--clobber). So the release is never empty, and a download link by
          # name keeps working while the new files arrive.
          # Until Stage 4 is done the release is a pre-release again, so "latest" does not
          # point at a release that is half old and half new.
          echo "Release $TAG exists, updating it; its files are replaced one by one"
          gh release edit "$TAG" --title "$TITLE" --notes-file ./output/release-body.md --prerelease --draft=false
        else
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file ./output/release-body.md --prerelease
        fi
        shopt -s nullglob
        manifests=(./output/*.manifest)
        if (( ${#manifests[@]} )); then
          gh release upload "$TAG" "${manifests[@]}" --clobber
        fi

    - name: Convert, Compress, and Upload Each Virtual Disk Format
      run: |
        ./scripts/convert-img-to-virtual-disk.sh "$TAG"
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}

    - name: Release created
      env:
        TITLE: ${{ steps.set_title.outputs.release_title }}
      run: |
        echo "::notice::Release ${TITLE} created successfully."

  invoke-appliance-packaging:
    needs: [create-release]
    runs-on: ubuntu-latest
    permissions:
      actions: write  # start the Stage 4 workflows and find their runs
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        packaging_workflow: [release-stage-4_package-for-utm.yml, release-stage-4_package-for-virtualbox.yml, release-stage-4_package-for-hyperv.yml]
    env:
      GH_TOKEN: ${{ github.token }}
      PACKAGING_WORKFLOW: ${{ matrix.packaging_workflow }}
    steps:
    - name: Trigger Appliance Packaging Workflow
      run: |
        # stay on the branch that was built
        gh workflow run "$PACKAGING_WORKFLOW" \
          --ref "$GITHUB_REF_NAME" \
          --field release_stream="$RELEASE_STREAM" \
          --field run_id="$BUILD_RUN_ID" \
          --field HOMEBRIDGE_VM_IMAGE_VERSION="$TAG"

    - name: Wait for Appliance Packaging Workflow to be visible to GH CLI
      run: |
        echo "::group::Waiting for ${BUILD_RUN_ID} workflow to appear in run list..."

        # Initialize variables
        WORKFLOW_URL=""
        MAX_RETRIES=12  # Retry for up to 1 minute (12 retries * 5 seconds)
        RETRY_COUNT=0

        # Retry loop
        while [[ -z "$WORKFLOW_URL" || "$WORKFLOW_URL" == "null" ]]; do
          if [[ $RETRY_COUNT -ge $MAX_RETRIES ]]; then
            echo "::error::Could not find triggered ${BUILD_RUN_ID} workflow run after 1 minute"
            gh run list --workflow "$PACKAGING_WORKFLOW" --event workflow_dispatch --limit 5 --json url,name || true
            exit 1
          fi

          # Increment retry count
          RETRY_COUNT=$((RETRY_COUNT + 1))

          # Check for the workflow run
          WORKFLOW_URL=$(gh run list --workflow "$PACKAGING_WORKFLOW" \
            --event workflow_dispatch \
            --limit 10 \
            --json url,name | jq -r --arg run_id "$BUILD_RUN_ID" '[.[] | select(.name | contains($run_id))][0].url // empty') || WORKFLOW_URL=""

          if [[ -z "$WORKFLOW_URL" || "$WORKFLOW_URL" == "null" ]]; then
            echo "::notice::Retry $RETRY_COUNT/$MAX_RETRIES: ${BUILD_RUN_ID} workflow not found. Retrying in 5 seconds..."
            sleep 5
          fi
        done
        echo "::notice::Found triggered ${BUILD_RUN_ID} workflow: $WORKFLOW_URL"
        echo "::endgroup::"

  wait-for-appliance-packaging:
      needs: [invoke-appliance-packaging]
      runs-on: ubuntu-latest
      permissions:
        actions: read  # read the state of the Stage 4 runs
      steps:
        - name: Wait for all Release Stage 4 packaging workflows with matching run_id to complete
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            workflows=$(gh run list --limit 50 --json name,databaseId,status,workflowName \
              | jq -r --arg run_id "$BUILD_RUN_ID" '.[] | select(.name | startswith("Release Stage 4 - Package for")) | select(.name | contains($run_id)) | "\(.databaseId) \(.status) \(.name)"')

            if [ -z "$workflows" ]; then
              echo "::error::No matching Release Stage 4 packaging workflows found for run_id: ${BUILD_RUN_ID}"
              exit 1
            fi

            while read -r run_id status name; do
              echo "::group::Waiting for workflow: $name (run_id: $run_id, status: $status)"
              while [ "$status" != "completed" ]; do
                sleep 30
                status=$(gh run view "$run_id" --json status | jq -r '.status')
                echo "Workflow $name (run_id: $run_id) status: $status"
              done
              conclusion=$(gh run view "$run_id" --json conclusion | jq -r '.conclusion')
              echo "Workflow $name (run_id: $run_id) completed with conclusion: $conclusion"
              if [ "$conclusion" != "success" ]; then
                echo "::error::Workflow $name failed with conclusion: $conclusion"
                exit 1
              fi
              echo "::endgroup::"
            done <<< "$workflows"

  # Old beta and alpha releases are only deleted after the new release is complete (every
  # Stage 4 workflow passed). So a good old release is never removed for a new one that failed.
  cleanup-old-releases-and-tags:
    needs: [wait-for-appliance-packaging]
    if: ${{ inputs.release_stream != 'stable' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout (the local action)
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Create GitHub App Token
      id: app-token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
        private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
        owner: homebridge
        repositories: homebridge-vm-image
        permission-contents: write

    - name: Cleanup older beta and alpha release and tags
      uses: ./.github/actions/cleanup-old-releases-and-tags
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        release-stream: ${{ inputs.release_stream }}
        releases-to-keep: 5

# stable release should be marked as non-prerelease, and latest.
# Only after every Stage 4 packaging workflow ended with success: until then the release stays
# a pre-release, so "latest" never points at a release with files missing.
  finalize-stable-release:
    needs: [wait-for-appliance-packaging]
    if: ${{ inputs.release_stream == 'stable' }}
    runs-on: ubuntu-latest
    steps:
    - name: Create GitHub App Token
      id: app-token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
        private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
        owner: homebridge
        repositories: homebridge-vm-image
        permission-contents: write

    # Mark stable release as non-prerelease and latest
    - name: Mark Stable Release as Non-Prerelease and Latest
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        gh release edit "$TAG" \
          --prerelease=false \
          --latest
