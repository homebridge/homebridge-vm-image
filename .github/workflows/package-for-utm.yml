name: Package for UTM

on:
  workflow_dispatch: # Allows manual triggering of the workflow
    inputs:
      release_stream:
        description: "Release stream (alpha, beta, stable)"
        required: false
        type: choice
        options:
          - alpha
          - beta
          - stable
        default: beta
      arch:
        description: "Architecture (arm64, amd64)"
        required: false
        type: choice
        options:
          - arm64
          - amd64
        default: arm64
      release_tag:
        description: "Release tag to download image files from"
        required: true

jobs:
  package-utm-vm:
    runs-on: macos-latest
    name: Run package-for-utm.sh on macOS ARM64

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Step 2: Set up environment
      - name: Set up environment variables
        run: |
          echo "RELEASE_STREAM=${{ github.event.inputs.release_stream }}" >> $GITHUB_ENV
          echo "ARCH=${{ github.event.inputs.arch }}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> $GITHUB_ENV

      # Step 3: Download image files from the release
      - name: Download specific image file from release
        run: |
          echo "Downloading specific artifact from release tag: ${{ inputs.RELEASE_TAG }}"
          gh release download ${{ inputs.RELEASE_TAG }} --dir ./output --repo ${{ github.repository }} --pattern "homebridge-vm-image-${{ inputs.RELEASE_STREAM }}-${{ inputs.ARCH }}.qcow2.gz"
          echo "Downloaded artifact:"
          ls -l ./output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Install dependencies
      - name: Cache Homebrew dependencies
        uses: actions/cache@v3
        with:
          path: |
            /usr/local/Homebrew
            /usr/local/Cellar
            /usr/local/Caskroom
          key: ${{ runner.os }}-brew-${{ hashFiles('Brewfile') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Install dependencies
        run: |
          echo "::group::Installing qemu"
          brew install qemu || true
          echo "::endgroup::"
          echo "::group::Installing UTM"
          brew install --cask utm || true
          echo "::endgroup::"
          if ! command -v utmctl &> /dev/null; then
            echo "utmctl not found. Ensure UTM is installed on the runner."
            exit 1
          fi
          echo "Dependencies installed."

      # Step 5: unzip the image
      - name: Uzip the image
        run: |
          gunzip ./output/homebridge-vm-image-${{ inputs.RELEASE_STREAM }}-${{ inputs.ARCH }}.qcow2.gz
          ls -lR ./output

      # Step 6: Run the script
      - name: Run package-for-utm.sh
        run: |
          chmod +x ./scripts/package-for-utm.sh
          ./scripts/package-for-utm.sh ${{ inputs.RELEASE_STREAM }} ${{ inputs.ARCH }}

      # Step 7: Verify output
      - name: Verify output
        run: |
          echo "Checking output directory..."
          ls -l ./output

      # Step 8: Upload UTM package as artifact
      - name: Upload UTM package
        uses: actions/upload-artifact@v4
        with:
          name: utm-package
          path: ./output/*.utm.gz
          retention-days: 7