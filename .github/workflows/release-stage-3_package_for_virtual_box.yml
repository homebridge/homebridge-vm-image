name: Release Stage 3 - Package and Validate Homebridge VM VirtualBox Appliance
run-name: Release Stage 3 - Package and Validate VirtualBox - Run ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Run ID of the build workflow that produced the artifacts'
        required: true
        type: string
      release_stream:
        description: 'Release stream (stable, beta, alpha)'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
        default: beta
      HOMEBRIDGE_VM_IMAGE_VERSION:
        description: 'Homebridge VM image version'
        required: true
        type: string

concurrency:
  group: package-and-validate-virtualbox
  cancel-in-progress: false

jobs:
  package-for-virtual-box:
    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
   
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          name: homebridge-image-${{ matrix.arch }}
          path: ./output
          run-id: ${{ inputs.run_id }}
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List Downloaded Artifacts
        run: ls -lR ./output

        # This is needed as Oracle's repo for Bookworm is missing dependency libvpx6
      - name: Install Packaging Dependencies
        run: |
          echo "::group::apt-get update"
          sudo apt-get update
          echo "::endgroup::"
          echo "::group::Install VirtualBox"
          wget -q https://www.virtualbox.org/download/oracle_vbox_2016.asc -O- | sudo gpg --dearmor -o /usr/share/keyrings/oracle_vbox_2016.gpg
          echo "deb [signed-by=/usr/share/keyrings/oracle_vbox_2016.gpg] https://download.virtualbox.org/virtualbox/debian jammy contrib" | sudo tee /etc/apt/sources.list.d/virtualbox.list
          sudo apt-get update
          sudo apt-get install -y virtualbox-7.0 || sudo apt-get install -y virtualbox-6.1 
          echo "::endgroup::"
          vboxmanage --version

      - name: Package VirtualBox Appliance
        id: package_appliance
        run: |
          ./scripts/package-for-virtual-box.sh "${{ matrix.arch }}" "${{ inputs.release_stream }}" "${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}"
          echo "OVA_FILE=./output/homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}.ova" >> $GITHUB_OUTPUT

      - name: Upload image and manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: virtualbox-appliance-${{ matrix.arch }}
          path: |
            ${{ steps.package_appliance.outputs.OVA_FILE }}
            ./output/*.manifest
            ./output/*.img

      - name: Validate VirtualBox Appliance Image
        run: |
          ./scripts/validate-virtual-box-package.sh ${{ steps.package_appliance.outputs.OVA_FILE }}

      - name: Packaging and Validation complete
        run: |
          echo "::notice::Homebridge VM image version: ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}"
          echo "::notice::Run ID: ${{ inputs.run_id }}"
          echo "::notice::Architecture: ${{ matrix.arch }}"
          echo "::notice::Release Stream: ${{ inputs.release_stream }}" 

  create-release:
    runs-on: ubuntu-latest
    needs: [package-for-virtual-box]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download manifest artifact
      uses: actions/download-artifact@v5
      with:
        name: virtualbox-appliance*
        path: ./output
        merge-multiple: true

    - name: List Downloaded Artifacts
      run: ls -lR ./output

    - name: Set Release Title
      id: set_title
      run: |
        if [[ "${{ inputs.release_stream }}" == "beta" ]]; then
          echo "RELEASE_TITLE=BETA: Homebridge VM Image Release ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}" >> $GITHUB_OUTPUT
        elif [[ "${{ inputs.release_stream }}" == "alpha" ]]; then
          echo "RELEASE_TITLE=ALPHA: Homebridge VM Image Release ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}" >> $GITHUB_OUTPUT
        else
          echo "RELEASE_TITLE=Homebridge VM Image Release ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME=${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}
        # Copy manifest for release asset with proper name
        cp manifest.md Docker.manifest
        gh release create "${TAG_NAME}" \
          --title "${{ steps.set_title.outputs.RELEASE_TITLE }}" \
          --notes-file manifest.md \
          --draft=false \
          Docker.manifest

    - name: Release created
      run: |
        echo "::notice::Release ${{ steps.set_title.outputs.RELEASE_TITLE }} created successfully." 