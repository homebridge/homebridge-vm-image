name: Release Stage 3 - Package and Validate Homebridge VM VirtualBox Appliance
run-name: Release Stage 3 - Package and Validate VirtualBox - Run ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Run ID of the build workflow that produced the artifacts'
        required: true
        type: string
      release_stream:
        description: 'Release stream (stable, beta, alpha)'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
        default: beta
      HOMEBRIDGE_VM_IMAGE_VERSION:
        description: 'Homebridge VM image version'
        required: true
        type: string

concurrency:
  group: package-and-validate-virtualbox
  cancel-in-progress: false

jobs:
  package-for-virtual-box:
    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
   
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          name: homebridge-image-${{ matrix.arch }}
          path: ./output
          run-id: ${{ inputs.run_id }}
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List Downloaded Artifacts
        run: ls -lR ./output

      - name: Install VirtualBox
        uses: ./.github/actions/install-virtualbox

      - name: Package VirtualBox Appliance
        id: package_appliance
        run: |
          ./scripts/package-for-virtual-box.sh "${{ matrix.arch }}" "${{ inputs.release_stream }}" "${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}"
          echo "OVA_FILE=./output/homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}.ova" >> $GITHUB_OUTPUT

      - name: Upload image and manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: virtualbox-appliance-${{ matrix.arch }}
          path: |
            ${{ steps.package_appliance.outputs.OVA_FILE }}
            ./output/*.manifest
            ./output/*.img

      - name: Packaging and Validation complete
        run: |
          echo "::notice::Homebridge VM image version: ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}"
          echo "::notice::Run ID: ${{ inputs.run_id }}"
          echo "::notice::Architecture: ${{ matrix.arch }}"
          echo "::notice::Release Stream: ${{ inputs.release_stream }}" 

  create-release:
    runs-on: ubuntu-latest
    needs: [package-for-virtual-box]
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download release artifacts
      uses: actions/download-artifact@v5
      with:
        pattern: virtualbox-appliance*
        path: ./output
        merge-multiple: true

    - name: List Downloaded Artifacts
      run: ls -lR ./output

    - name: Install QEMU
      run: sudo apt-get install -y qemu-utils

    - name: Create QCOW2, VDI, VHDX amd VMDK images from IMG
      run: |
        for img in ./output/*.img; do
          base_name=$(basename "$img" .img)
          for ext in qcow2 vdi vhdx vmdk; do
            echo "Converting $img to $ext format" 
            qemu-img convert -O $ext "$img" "./output/${base_name}.$ext" && gzip -k "./output/${base_name}.$ext"
            ls -l ./output/
          done
        done
        # Cleanup original IMG files to save space
        rm ./output/*.img

    - name: Set Release Title
      id: set_title
      run: |
        if [[ "${{ inputs.release_stream }}" == "beta" ]]; then
          echo "RELEASE_TITLE=BETA: Homebridge VM Image Release ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}" >> $GITHUB_OUTPUT
        elif [[ "${{ inputs.release_stream }}" == "alpha" ]]; then
          echo "RELEASE_TITLE=ALPHA: Homebridge VM Image Release ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}" >> $GITHUB_OUTPUT
        else
          echo "RELEASE_TITLE=Homebridge VM Image Release ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Prerelease
      id: create_release
      uses: docker://ghcr.io/mini-bomba/create-github-release:v1.2.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}
        prerelease: true
        draft: false
        name: ${{ steps.set_title.outputs.release_title }}
        files: |
          ./output/*.manifest
          ./output/*.ova
          ./output/*.qcow2
          ./output/*.vdi
          ./output/*.vhdx
          ./output/*.vmdk

        body: |
          This is a test release only. Please test the VirtualBox appliance and report any issues you find.
        clear_attachments: true
        fail_on_no_files: true

    - name: Release created
      run: |
        echo "::notice::Release ${{ steps.set_title.outputs.RELEASE_TITLE }} created successfully."

  invoke-package-and-validate:
    needs: [create-release]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        arch: [amd64]
    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v5

    # Step 2: Trigger Packaging and Validation Workflow
    - name: Trigger Packaging and Validation Workflow
      run: |
        gh workflow run "reusable-validate-release-artifacts.yml" \
          --ref "latest" \
          --field release_stream="${{ inputs.release_stream }}" \
          --field release_tag="${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}" \
          --field arch="${{ matrix.arch }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}