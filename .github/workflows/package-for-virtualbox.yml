name: Release Stage 3.5 - Package and Validate Homebridge VM VirtualBox Appliance
run-name: Release Stage 3.5 - Package and Validate VirtualBox - Run ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Run ID of the build workflow that produced the artifacts'
        required: true
        type: string
      release_stream:
        description: 'Release stream (stable, beta, alpha)'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
        default: beta
      HOMEBRIDGE_VM_IMAGE_VERSION:
        description: 'Homebridge VM image version aka release tag'
        required: true
        type: string

concurrency:
  group: package-and-validate-virtualbox
  cancel-in-progress: false

jobs:
  package-for-virtual-box:
    runs-on: ubuntu-22.04
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
   
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          name: homebridge-image-${{ matrix.arch }}
          path: ./output
          run-id: ${{ inputs.run_id }}
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List Downloaded Artifacts
        run: ls -lR ./output

      - name: Install VirtualBox
        uses: ./.github/actions/install-virtualbox

      - name: Package VirtualBox Appliance
        id: package_appliance
        run: |
          ./scripts/package-for-virtual-box.sh "${{ matrix.arch }}" "${{ inputs.release_stream }}" "${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}"
          echo "OVA_FILE=./output/homebridge-vm-image-${{ inputs.release_stream }}-${{ matrix.arch }}.ova" >> $GITHUB_OUTPUT

      - name: Upload image and manifest artifacts
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: virtualbox-appliance-${{ matrix.arch }}
          path: |
            ${{ steps.package_appliance.outputs.OVA_FILE }}
            ./output/*.manifest
            ./output/*.img

      - name: Upload OVA to GitHub Release
        run: |
          set -e
          RELEASE_ID=$(gh release view "${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}" --json id -q .id)
          gh release upload "${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}" "${{ steps.package_appliance.outputs.OVA_FILE }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Packaging complete
        run: |
          echo "::notice::Homebridge VM image version: ${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}"
          echo "::notice::Run ID: ${{ inputs.run_id }}"
          echo "::notice::Architecture: ${{ matrix.arch }}"
          echo "::notice::Release Stream: ${{ inputs.release_stream }}" 

  invoke-package-and-validate:
    needs: [package-for-virtual-box]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        arch: [amd64]
    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v5

    # Step 2: Trigger Packaging and Validation Workflow
    - name: Trigger Packaging and Validation Workflow
      run: |
        gh workflow run "reusable-validate-release-artifacts.yml" \
          --ref "latest" \
          --field release_stream="${{ inputs.release_stream }}" \
          --field release_tag="${{ inputs.HOMEBRIDGE_VM_IMAGE_VERSION }}" \
          --field arch="${{ matrix.arch }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}