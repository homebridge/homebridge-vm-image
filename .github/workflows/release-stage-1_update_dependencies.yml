name: Release Stage 1 - Dependency Management - Update and Build
run-name: Release Stage 1 - Dependency Management - ${{ github.event_name == 'workflow_dispatch' && format('Manual - {0}', github.event.inputs.release_stream) || 'Scheduled' }} Run

on:
  schedule:
    # Daily updates - 6 AM Eastern (10 AM UTC), processes stable, beta and alpha streams
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      release_stream:
        description: 'Choose release stream to update and build'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
          - all
        default: all
      skip_build:
        description: 'Skip build and only update dependencies'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-stage-1-update-dependencies
  cancel-in-progress: false

# No rights by default. Each job below asks for what it needs.
permissions: {}

jobs:
  define-matrix:
    name: Define Jobs Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix based on trigger
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_STREAM: ${{ github.event.inputs.release_stream }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$RELEASE_STREAM" != "all" ]]; then
            echo "matrix=$(jq -cn --arg stream "$RELEASE_STREAM" '{stream: [$stream]}')" >> "$GITHUB_OUTPUT"
          else
            # Scheduled run, or "all" - process stable, beta, and alpha streams
            echo 'matrix={"stream":["stable","beta","alpha"]}' >> "$GITHUB_OUTPUT"
          fi

      - name: Output matrix for debugging
        env:
          MATRIX: ${{ steps.set-matrix.outputs.matrix }}
        run: |
          echo "::notice::Dependencies Matrix: ${MATRIX}"

  update-dependencies:
    name: Update ${{ matrix.stream }} Dependencies
    needs: define-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout, and read the releases. The bot pushes with its own App token.
      actions: write  # start the Stage 2 workflow and read its state
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        stream: ${{ fromJson(needs.define-matrix.outputs.matrix).stream }}
    steps:
      # Beta and alpha build from the newest <stream>-YYYY.M.D branch when one exists
      # (e.g. beta-2026.11.18), so unreleased features can ship to that stream without
      # touching latest. Stable, and beta/alpha without such a branch, use latest.
      - name: Resolve ${{ matrix.stream }} Branch
        id: resolve-branch
        env:
          GH_TOKEN: ${{ github.token }}
          STREAM: ${{ matrix.stream }}
        run: |
          BRANCH="latest"
          if [[ "$STREAM" == "beta" || "$STREAM" == "alpha" ]]; then
            CANDIDATE=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${STREAM}-" \
              --jq '.[].ref | sub("^refs/heads/"; "")' \
              | grep -E "^${STREAM}-[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$" \
              | sort -V | tail -n 1 || true)
            [[ -n "$CANDIDATE" ]] && BRANCH="$CANDIDATE"
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "**${STREAM}** builds from \`${BRANCH}\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Create Dependency Bot App Token
        id: dependency-bot-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          owner: homebridge
          repositories: homebridge-vm-image
          permission-contents: write

      - name: Update Dependencies ${{ matrix.stream }}
        id: homebridge-bot
        uses: homebridge/dependency-bot@latest
        with:
          config_file: '.github/homebridge-dependency-bot-${{ matrix.stream }}.json'
          release_stream: ${{ matrix.stream }}
          base_branch: ${{ steps.resolve-branch.outputs.branch }}
          # GitHub App on latest's bypass list, for direct pushes. The bot configs use
          # "update_method": "push", so the bot needs no second token (the personal access
          # token was only for approving and merging pull requests).
          PUBLISH_TOKEN: ${{ steps.dependency-bot-token.outputs.token }}

      # The branch tip is checked out, so a push the bot just made is included.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve-branch.outputs.branch }}
          persist-credentials: false

      - name: Decide whether to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          STREAM: ${{ matrix.stream }}
          CHANGES_DETECTED: ${{ steps.homebridge-bot.outputs.changes_detected }}
          AUTO_MERGE: ${{ steps.homebridge-bot.outputs.auto_merge }}
          SKIP_BUILD: ${{ github.event.inputs.skip_build || 'false' }}
        run: |
          # true when the versions on the branch are not in the newest release of this stream,
          # for example because the build that should have released them failed
          UNRELEASED="$(./scripts/unreleased-versions.sh "$STREAM")"

          BUILD=false
          if [[ "$SKIP_BUILD" == "true" ]]; then
            echo "::notice::${STREAM} Stage 2 not triggered: skip_build was chosen"
          elif [[ "$AUTO_MERGE" != "true" ]]; then
            echo "::warning::${STREAM} Stage 2 not triggered: the bot does not merge by itself (Auto Merge=${AUTO_MERGE})"
          elif [[ "$CHANGES_DETECTED" == "true" ]]; then
            echo "::notice::${STREAM}: the bot found new versions, starting a build"
            BUILD=true
          elif [[ "$UNRELEASED" == "true" ]]; then
            echo "::notice::${STREAM}: the versions on the branch were never released, starting a build"
            BUILD=true
          else
            echo "::notice::${STREAM} Stage 2 not triggered: nothing new (Changes Detected=${CHANGES_DETECTED})"
          fi
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"

      # This step fails when the build fails or takes too long, so this workflow run shows red.
      - name: Trigger and Wait for ${{ matrix.stream }} Stage 2 Workflow
        if: steps.plan.outputs.build == 'true'
        uses: ./.github/actions/trigger-and-wait-workflow
        with:
          workflow-file: 'release-stage-2_build_and_push_images.yml'
          ref: ${{ steps.resolve-branch.outputs.branch }}
          github-token: ${{ github.token }}
          # Stage 2 builds, tests the boot, and then waits for Stage 3 and the Stage 4 packaging
          timeout-minutes: '300'
          workflow-fields: |
            release_stream=${{ matrix.stream }}
            Scheduled=${{ github.event_name == 'workflow_dispatch' && 'Manual' || 'Scheduled' }}
          run-name: "${{ matrix.stream }}:${{ github.run_id }}"
