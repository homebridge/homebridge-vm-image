name: Validate Homebridge x86 VM Image on Windows

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Optional URL to a specific x86 .img.gz image (overrides latest release)'
        required: false
        type: string

permissions:
  contents: read  # Grants read access to repository contents, including releases

jobs:

  validate:
    timeout-minutes: 30
    runs-on: windows-latest  # x64 runner, supports x86 VMs via Hyper-V

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log runner architecture
      shell: powershell
      run: |
        $arch = Get-CimInstance Win32_OperatingSystem | Select-Object -ExpandProperty OSArchitecture
        Write-Output "Runner architecture: $arch (validating x86 VM image)"



    - name: Determine latest image URL from releases
      id: download
      if: ${{ !inputs.image_url }}
      shell: powershell
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
        try {
          Write-Output "Downloading latest release info from https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          $response = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers $headers
          $asset = $response.assets | Where-Object { $_.name -like "*amd64.img.gz" }
          if (-not $asset) { Write-Error "No *.amd64.img.gz found in latest release"; exit 1 }
          Write-Output "Found x86 asset: $($asset.name) at $($asset.browser_download_url)"
          echo "download_url=$($asset.browser_download_url)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "image_name=$($asset.name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } catch {
          if ($_.Exception.Response.StatusCode -eq 404) {
            Write-Error "No releases found in the repository"
            exit 1
          } elseif ($_.Exception.Response.StatusCode -eq 403 -or $_.Exception.Response.StatusCode -eq 401) {
            Write-Error "Permission denied: Ensure 'contents: read' is set"
            exit 1
          } else {
            Write-Error "Failed to fetch release: $($_.Exception.Message)"
            exit 1
          }
        }

    - name: Use provided image URL
      id: custom_image
      if: ${{ inputs.image_url }}
      shell: powershell
      run: |
        $url = "${{ inputs.image_url }}"
        $imageName = [System.IO.Path]::GetFileName($url)
        if (-not $imageName.EndsWith('.img.gz')) {
          Write-Error "Provided URL must point to a .img.gz file"
          exit 1
        }
        if ($imageName -notlike "*x86*" -and $imageName -notlike "*i386*") {
          Write-Warning "Provided image URL may not be x86; proceeding with validation"
        }
        echo "download_url=$url" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "image_name=$imageName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    
    - name: Download and decompress image
      shell: powershell
      run: |
        $url = if ($env:download_url) {
          $env:download_url
        } elseif ($env:custom_image_download_url) {
          $env:custom_image_download_url
        } else {
          ""
        }
        $imageName = $env:image_name
        if (-not $url) {
          Write-Error "No valid URL found. Ensure either the 'download' or 'custom_image' step sets the URL."
          exit 1
        }
        if (-not $imageName) {
          Write-Error "No valid image name found. Ensure either the 'download' or 'custom_image' step sets the image name."
          exit 1
        }
        $outputDir = $env:GITHUB_WORKSPACE
        $outputPath = Join-Path $outputDir $imageName
        # Debug output
        Write-Output "Debug: GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE"
        Write-Output "Debug: URL = $url"
        Write-Output "Debug: Image Name = $imageName"
        Write-Output "Debug: Output Directory = $outputDir"
        Write-Output "Debug: Output Path = $outputPath"
        # Ensure the output directory exists
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        Write-Output "Ensured directory exists: $outputDir"
        # Verify output path is a file, not a directory
        if ($outputPath -match '\\$') {
          Write-Error "Output path ends with a backslash: $outputPath"
          exit 1
        }
        Write-Output "Downloading image from: $url to $outputPath"
        Invoke-WebRequest -Uri $url -OutFile $outputPath
        $decompressedPath = $outputPath -replace '\.gz$', ''
        # Decompress the .gz file using gzip and write bytes directly
        Write-Output "Decompressing $outputPath to $decompressedPath"
        $decompressedBytes = & gzip -d $outputPath -c
        [System.IO.File]::WriteAllBytes($decompressedPath, $decompressedBytes)
        Write-Output "Image decompressed to: $decompressedPath"
        echo "IMAGE_PATH=$decompressedPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Enable Hyper-V
      shell: powershell
      run: |
        Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V -All -NoRestart
        if (-not $?) { throw "Failed to enable Hyper-V" }

    - name: Install QEMU for image conversion
      shell: powershell
      run: |
        choco install qemu --no-progress -y
        if (-not $?) { throw "Failed to install QEMU" }

    - name: Create and configure Hyper-V VM
      shell: powershell
      run: |
        $imagePath = $env:IMAGE_PATH
        $vmName = "HomebridgeTestVM"
        $vhdPath = Join-Path $env:TEMP "homebridge.vhdx"
        
        # Convert .img to .vhdx for x86 VM
        & qemu-img convert -f raw -O vhdx -o subformat=dynamic $imagePath $vhdPath
        if (-not $?) { throw "Failed to convert image to VHDX" }
        
        # Create x86 VM (Generation 1 for x86 compatibility)
        New-VM -Name $vmName -MemoryStartupBytes 1GB -Generation 1 -VHDPath $vhdPath -SwitchName "Default Switch"
        if (-not $?) { throw "Failed to create VM" }
        Set-VMProcessor -VMName $vmName -Count 1
        Enable-VMIntegrationService -VMName $vmName -Name "Guest Service Interface"
        Write-Output "Created x86 VM: $vmName"

    - name: Start VM and validate
      shell: powershell
      timeout-minutes: 5
      run: |
        $vmName = "HomebridgeTestVM"
        Start-VM -Name $vmName
        if (-not $?) { throw "Failed to start VM" }
        
        $timeout = 300
        $elapsed = 0
        $interval = 10
        while ($elapsed -lt $timeout) {
          $vmState = Get-VM -Name $vmName | Select-Object -ExpandProperty State
          if ($vmState -eq "Running") {
            Start-Sleep -Seconds $interval
            $elapsed += $interval
            if (Test-NetConnection -ComputerName "localhost" -Port 8581 -InformationLevel Quiet) {
              Write-Output "Homebridge UI accessible on port 8581"
              break
            }
          } else {
            Write-Output "VM state: $vmState"
            Start-Sleep -Seconds $interval
            $elapsed += $interval
          }
        }
        if ($elapsed -ge $timeout) {
          Stop-VM -Name $vmName -Force
          throw "VM validation timed out"
        }
        Write-Output "x86 VM validation complete"

    - name: Cleanup
      if: always()
      shell: powershell
      run: |
        $vmName = "HomebridgeTestVM"
        Stop-VM -Name $vmName -Force -ErrorAction SilentlyContinue
        Remove-VM -Name $vmName -Force -ErrorAction SilentlyContinue
        Remove-Item -Path $env:IMAGE_PATH -Force -ErrorAction SilentlyContinue
        Remove-Item -Path (Join-Path $env:TEMP "homebridge.vhdx") -Force -ErrorAction SilentlyContinue