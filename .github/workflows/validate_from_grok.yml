name: Validate Homebridge x86 VM Image on Windows

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Optional URL to a specific x86 .img.gz image (overrides latest release)'
        required: false
        type: string

permissions:
  contents: read  # Grants read access to repository contents, including releases

jobs:
  validate:
    runs-on: windows-latest  # x64 runner, supports x86 VMs via Hyper-V

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache QEMU and gzip
      id: cache-tools
      uses: actions/cache@v4
      with:
        path: |
          C:\ProgramData\chocolatey\lib\qemu
          C:\ProgramData\chocolatey\lib\gzip
          C:\Program Files\qemu
        key: ${{ runner.os }}-tools-qemu-gzip-${{ hashFiles('**/validate_from_grok.yml') }}
        restore-keys: |
          ${{ runner.os }}-tools-qemu-gzip-

    - name: Install QEMU and gzip
      shell: powershell
      run: |
        $qemuInstalled = Test-Path "C:\ProgramData\chocolatey\bin\qemu-img.exe" -or Test-Path "C:\Program Files\qemu\qemu-img.exe"
        $gzipInstalled = Test-Path "C:\ProgramData\chocolatey\bin\gzip.exe"
        Write-Output "Debug: QEMU installed = $qemuInstalled"
        Write-Output "Debug: gzip installed = $gzipInstalled"
        Write-Output "Debug: Cache hit for tools = ${{ steps.cache-tools.outputs.cache-hit }}"
        if ($qemuInstalled -and $gzipInstalled) {
          Write-Output "QEMU and gzip found in cache, skipping installation"
        } else {
          Write-Output "Installing QEMU and gzip via Chocolatey"
          choco install qemu --no-progress -y
          if (-not $?) { throw "Failed to install QEMU" }
          choco install gzip --no-progress -y
          if (-not $?) { throw "Failed to install gzip" }
        }
        # Ensure QEMU is in PATH
        $qemuPath = if (Test-Path "C:\Program Files\qemu\qemu-img.exe") { "C:\Program Files\qemu" } elseif (Test-Path "C:\ProgramData\chocolatey\bin\qemu-img.exe") { "C:\ProgramData\chocolatey\bin" } else { $null }
        if ($qemuPath) {
          Write-Output "Adding QEMU path to PATH: $qemuPath"
          $env:PATH = "$qemuPath;$env:PATH"
          [System.Environment]::SetEnvironmentVariable("PATH", "$qemuPath;$env:PATH", [System.EnvironmentVariableTarget]::Process)
        } else {
          Write-Error "qemu-img.exe not found in expected locations"
          exit 1
        }
        # Debug QEMU and gzip locations
        $qemuImgPath = Get-Command qemu-img -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
        $gzipPath = Get-Command gzip -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
        Write-Output "Debug: qemu-img path = $qemuImgPath"
        Write-Output "Debug: gzip path = $gzipPath"
        if (-not $qemuImgPath) {
          Write-Error "qemu-img not found in PATH"
          exit 1
        }
        if (-not $gzipPath) {
          Write-Error "gzip not found in PATH"
          exit 1
        }
        Write-Output "QEMU version: $(& qemu-img --version)"
        Write-Output "gzip version: $(& gzip --version)"

    - name: Determine latest image URL from releases
      id: download
      if: ${{ !inputs.image_url }}
      shell: powershell
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
        try {
          Write-Output "Downloading latest release info from https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          $response = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" -Headers $headers
          $asset = $response.assets | Where-Object { $_.name -like "*amd64.img.gz" }
          if (-not $asset) { Write-Error "No *.amd64.img.gz found in latest release"; exit 1 }
          Write-Output "Found x86 asset: $($asset.name) at $($asset.browser_download_url)"
          echo "download_url=$($asset.browser_download_url)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "image_name=$($asset.name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "release_tag=$($response.tag_name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } catch {
          if ($_.Exception.Response.StatusCode -eq 404) {
            Write-Error "No releases found in the repository"
            exit 1
          } elseif ($_.Exception.Response.StatusCode -eq 403 -or $_.Exception.Response.StatusCode -eq 401) {
            Write-Error "Permission denied: Ensure 'contents: read' is set"
            exit 1
          } else {
            Write-Error "Failed to fetch release: $($_.Exception.Message)"
            exit 1
          }
        }

    - name: Use provided image URL
      id: custom_image
      if: ${{ inputs.image_url }}
      shell: powershell
      run: |
        $url = "${{ inputs.image_url }}"
        $imageName = [System.IO.Path]::GetFileName($url)
        if (-not $imageName.EndsWith('.img.gz')) {
          Write-Error "Provided URL must point to a .img.gz file"
          exit 1
        }
        if ($imageName -notlike "*x86*" -and $imageName -notlike "*i386*") {
          Write-Warning "Provided image URL may not be x86; proceeding with validation"
        }
        echo "download_url=$url" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "image_name=$imageName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "release_tag=custom-$($url.GetHashCode())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Cache downloaded image
      id: cache-image
      uses: actions/cache@v4
      with:
        path: ${{ env.GITHUB_WORKSPACE }}\${{ env.image_name }}
        key: ${{ runner.os }}-image-${{ env.image_name }}-${{ env.release_tag }}
        restore-keys: |
          ${{ runner.os }}-image-${{ env.image_name }}-

    - name: Download image
      shell: powershell
      run: |
        $url = if ($env:download_url) {
          $env:download_url
        } elseif ($env:custom_image_download_url) {
          $env:custom_image_download_url
        } else {
          ""
        }
        $imageName = $env:image_name
        if (-not $url) {
          Write-Error "No valid URL found. Ensure either the 'download' or 'custom_image' step sets the URL."
          exit 1
        }
        if (-not $imageName) {
          Write-Error "No valid image name found. Ensure either the 'download' or 'custom_image' step sets the image name."
          exit 1
        }
        $outputDir = $env:GITHUB_WORKSPACE
        $outputPath = Join-Path $outputDir $imageName
        # Debug output
        Write-Output "Debug: GITHUB_WORKSPACE = $env:GITHUB_WORKSPACE"
        Write-Output "Debug: URL = $url"
        Write-Output "Debug: Image Name = $imageName"
        Write-Output "Debug: Output Directory = $outputDir"
        Write-Output "Debug: Output Path = $outputPath"
        Write-Output "Debug: Cache hit = ${{ steps.cache-image.outputs.cache-hit }}"
        # Ensure the output directory exists
        New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
        Write-Output "Ensured directory exists: $outputDir"
        # Verify output path is a file, not a directory
        if ($outputPath -match '\\$') {
          Write-Error "Output path ends with a backslash: $outputPath"
          exit 1
        }
        # Check if file exists from cache
        if (Test-Path $outputPath) {
          Write-Output "Found cached image at: $outputPath"
          $fileSize = (Get-Item $outputPath).Length
          Write-Output "Cached file size: $fileSize bytes"
          if ($fileSize -eq 0) {
            Write-Error "Cached file is empty"
            exit 1
          }
        } else {
          Write-Output "No cached image found, downloading from: $url to $outputPath"
          $maxRetries = 3
          $retryCount = 0
          do {
            try {
              Write-Output "Download attempt $($retryCount + 1) of $maxRetries"
              Invoke-WebRequest -Uri $url -OutFile $outputPath -ErrorAction Stop
              break
            } catch {
              $retryCount++
              if ($retryCount -ge $maxRetries) {
                Write-Error "Failed to download after $maxRetries attempts: $($_.Exception.Message)"
                exit 1
              }
              Start-Sleep -Seconds 5
            }
          } while ($true)
          $fileSize = (Get-Item $outputPath).Length
          Write-Output "Downloaded file size: $fileSize bytes"
          if ($fileSize -eq 0) {
            Write-Error "Downloaded file is empty"
            exit 1
          }
        }
        echo "DOWNLOADED_IMAGE_PATH=$outputPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Decompress image
      shell: powershell
      run: |
        $outputPath = $env:DOWNLOADED_IMAGE_PATH
        if (-not $outputPath -or -not (Test-Path $outputPath)) {
          Write-Error "Downloaded image path not found: $outputPath"
          exit 1
        }
        $decompressedPath = $outputPath -replace '\.gz$', ''
        # Debug output
        Write-Output "Debug: Downloaded Image Path = $outputPath"
        Write-Output "Debug: Decompressed Path = $decompressedPath"
        # Decompress the .gz file using gzip
        Write-Output "Decompressing $outputPath to $decompressedPath"
        $process = Start-Process -FilePath "gzip" -ArgumentList "-d", "-c", $outputPath -NoNewWindow -PassThru -RedirectStandardOutput $decompressedPath -RedirectStandardError "gzip-error.log" -Wait
        if ($process.ExitCode -ne 0) {
          $errorLog = if (Test-Path "gzip-error.log") { Get-Content "gzip-error.log" -Raw } else { "No error log available" }
          Write-Error "Failed to decompress $outputPath. gzip exit code: $($process.ExitCode). Error: $errorLog"
          exit 1
        }
        Write-Output "Image decompressed to: $decompressedPath"
        # Verify decompressed file exists and is non-empty
        if (-not (Test-Path $decompressedPath)) {
          Write-Error "Decompressed file $decompressedPath does not exist"
          exit 1
        }
        $decompressedSize = (Get-Item $decompressedPath).Length
        Write-Output "Decompressed file size: $decompressedSize bytes"
        if ($decompressedSize -eq 0) {
          Write-Error "Decompressed file is empty"
          exit 1
        }
        echo "IMAGE_PATH=$decompressedPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Enable Hyper-V
      shell: powershell
      run: |
        Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V -All -NoRestart
        if (-not $?) { throw "Failed to enable Hyper-V" }

    - name: Create and configure Hyper-V VM
      shell: powershell
      run: |
        $imagePath = $env:IMAGE_PATH
        $vmName = "HomebridgeTestVM"
        $vhdPath = Join-Path $env:TEMP "homebridge.vhdx"
        
        # Convert .img to .vhdx for x86 VM
        & qemu-img convert -f raw -O vhdx -o subformat=dynamic $imagePath $vhdPath
        if (-not $?) { throw "Failed to convert image to VHDX" }
        
        # Create x86 VM (Generation 1 for x86 compatibility)
        New-VM -Name $vmName -MemoryStartupBytes 1GB -Generation 1 -VHDPath $vhdPath -SwitchName "Default Switch"
        if (-not $?) { throw "Failed to create VM" }
        Set-VMProcessor -VMName $vmName -Count 1
        Enable-VMIntegrationService -VMName $vmName -Name "Guest Service Interface"
        Write-Output "Created x86 VM: $vmName"

    - name: Start VM and validate
      shell: powershell
      timeout-minutes: 5
      run: |
        $vmName = "HomebridgeTestVM"
        Start-VM -Name $vmName
        if (-not $?) { throw "Failed to start VM" }
        
        $timeout = 300
        $elapsed = 0
        $interval = 10
        while ($elapsed -lt $timeout) {
          $vmState = Get-VM -Name $vmName | Select-Object -ExpandProperty State
          if ($vmState -eq "Running") {
            Start-Sleep -Seconds $interval
            $elapsed += $interval
            if (Test-NetConnection -ComputerName "localhost" -Port 8581 -InformationLevel Quiet) {
              Write-Output "Homebridge UI accessible on port 8581"
              break
            }
          } else {
            Write-Output "VM state: $vmState"
            Start-Sleep -Seconds $interval
            $elapsed += $interval
          }
        }
        if ($elapsed -ge $timeout) {
          Stop-VM -Name $vmName -Force
          throw "VM validation timed out"
        }
        Write-Output "x86 VM validation complete"

    - name: Cleanup
      if: always()
      shell: powershell
      run: |
        $vmName = "HomebridgeTestVM"
        Stop-VM -Name $vmName -Force -ErrorAction SilentlyContinue
        Remove-VM -Name $vmName -Force -ErrorAction SilentlyContinue
        Remove-Item -Path $env:IMAGE_PATH -Force -ErrorAction SilentlyContinue
        Remove-Item -Path (Join-Path $env:TEMP "homebridge.vhdx") -Force -ErrorAction SilentlyContinue