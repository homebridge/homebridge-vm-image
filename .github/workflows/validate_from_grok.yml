name: Validate Homebridge VM Image on ARM64 Windows

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest  # ARM64-native runner

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download latest image
      id: download
      uses: actions/github-script@v7
      with:
        script: |
          const response = await github.rest.releases.getLatest({
            owner: context.repo.owner,
            repo: context.repo.repo
          });
          const assets = response.data.assets;
          const imgAsset = assets.find(asset => asset.name.endsWith('.img.gz'));
          if (!imgAsset) {
            core.setFailed('No .img.gz image found in latest release');
            return;
          }
          core.setOutput('download_url', imgAsset.browser_download_url);
          core.setOutput('image_name', imgAsset.name);

    - name: Download and decompress image
      shell: powershell
      run: |
        $url = "${{ steps.download.outputs.download_url }}"
        $imageName = "${{ steps.download.outputs.image_name }}"
        $outputPath = Join-Path $env:GITHUB_WORKSPACE $imageName
        Invoke-WebRequest -Uri $url -OutFile $outputPath
        $decompressedPath = $outputPath -replace '\.gz$', ''
        & gzip -d $outputPath -c | Out-File -FilePath $decompressedPath -Encoding Bytes
        Write-Output "Image decompressed to: $decompressedPath"
        echo "IMAGE_PATH=$decompressedPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append

    - name: Enable Hyper-V
      shell: powershell
      run: |
        Enable-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V -All -NoRestart
        # Note: Runner may require restart, but in GH Actions, we proceed assuming it's pre-enabled

    - name: Create and configure Hyper-V VM
      shell: powershell
      run: |
        $imagePath = $env:IMAGE_PATH
        $vmName = "HomebridgeTestVM"
        $vhdPath = Join-Path $env:TEMP "homebridge.vhd"
        
        # Convert .img to .vhd (using qemu-img if available, or simple copy for raw disk)
        # Assuming .img is raw; for VHDX, adjust accordingly
        $null = New-VHD -Path $vhdPath -Fixed -SizeBytes (10GB)  # 10GB fixed VHD
        # Mount and copy image contents (simplified; in prod, use disk2vhd or dd equivalent)
        Mount-DiskImage -ImagePath $imagePath
        $driveLetter = (Get-DiskImage -ImagePath $imagePath | Get-Volume).DriveLetter
        Copy-Item -Path "$driveLetter\*" -Destination $vhdPath -Recurse -Force
        Dismount-DiskImage -ImagePath $imagePath
        
        # Create VM
        New-VM -Name $vmName -MemoryStartupBytes 1GB -Generation 1 -VHDPath $vhdPath -SwitchName "Default Switch"
        Set-VMProcessor -VMName $vmName -Count 1
        Enable-VMIntegrationService -VMName $vmName -Name "Guest Service Interface"

    - name: Start VM and validate
      shell: powershell
      timeout-minutes: 5
      run: |
        $vmName = "HomebridgeTestVM"
        Start-VM -Name $vmName
        
        # Wait for boot (poll for IP or heartbeat)
        $timeout = 300  # 5 min
        $elapsed = 0
        $interval = 10
        $vmIp = $null
        
        while ($elapsed -lt $timeout) {
          $vmState = Get-VM -Name $vmName | Select-Object -ExpandProperty State
          if ($vmState -eq "Running") {
            # Poll for network/IP (simplified; use Get-VMNetworkAdapter)
            Start-Sleep -Seconds $interval
            $elapsed += $interval
            
            # Assume bridged network gets IP; check if Homebridge UI is responsive
            # For real validation, use Invoke-WebRequest to http://VM_IP:8581
            # Here, simulate with a placeholder check (extend with actual IP fetch)
            if (Test-NetConnection -ComputerName "localhost" -Port 8581 -InformationLevel Quiet) {
              Write-Output "Homebridge UI accessible!"
              break
            }
          } else {
            Write-Output "VM state: $vmState"
            Start-Sleep -Seconds $interval
            $elapsed += $interval
          }
        }
        
        if ($elapsed -ge $timeout) {
          Stop-VM -Name $vmName -Force
          throw "VM validation timed out"
        }
        
        # Additional checks: e.g., run custom script inside VM via PowerShell Direct
        Invoke-Command -VMName $vmName -ScriptBlock { 
          if (Get-Service -Name "homebridge" -ErrorAction SilentlyContinue) { 
            Write-Output "Homebridge service running" 
          } else { 
            throw "Homebridge service not found" 
          } 
        } -Credential (Get-Credential)  # May need default creds or setup

    - name: Cleanup
      if: always()
      shell: powershell
      run: |
        $vmName = "HomebridgeTestVM"
        Stop-VM -Name $vmName -Force -ErrorAction SilentlyContinue
        Remove-VM -Name $vmName -Force -ErrorAction SilentlyContinue
        Remove-Item -Path $env:IMAGE_PATH -Force -ErrorAction SilentlyContinue