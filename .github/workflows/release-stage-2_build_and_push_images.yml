name: Release Stage 2 - Build and Push Homebridge VM Images
run-name: Release Stage 2 - ${{ github.event.inputs.Scheduled}} - Build and Push - ${{ inputs.release_stream }} - ${{ github.run_id }} - ${{ inputs.run_name }}

on:
  workflow_dispatch:
    inputs:
      release_stream:
        description: 'Choose release type: "stable" (builds latest version), "beta" (builds beta version with beta-YYYY-MM-DD tag), or "alpha" (builds alpha version with alpha-YYYY-MM-DD tag).'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
        default: beta
      Scheduled:
          description: 'Whether this is a scheduled run'
          required: false
          type: choice
          options:
            - Scheduled
            - Manual
          default: Manual
      run_name:
        description: 'Unique name of the run'
        required: false
        type: string
        default: ''

concurrency:
  group: stage-2-build-and-push
  cancel-in-progress: false

# No rights by default. Each job below asks for what it needs.
permissions: {}

jobs:
  set-versions:
    runs-on: ubuntu-latest
    outputs:
      HOMEBRIDGE_VM_IMAGE_VERSION: ${{ steps.release_tag.outputs.HOMEBRIDGE_VM_IMAGE_VERSION }}

    steps:
    # Only beta and alpha may build from a pre-release branch (e.g. beta-2026.11.18).
    # Stable must come from latest, so a branch can never publish a stable release.
    - name: Check Release Branch
      env:
        RELEASE_STREAM: ${{ inputs.release_stream }}
      run: |
        if [[ "$RELEASE_STREAM" != "beta" && "$RELEASE_STREAM" != "alpha" && "$GITHUB_REF_NAME" != "latest" ]]; then
          echo "::error::${RELEASE_STREAM} releases must be built from the latest branch, not ${GITHUB_REF_NAME}"
          exit 1
        fi
        if [[ "$GITHUB_REF_NAME" != "latest" && ! "$GITHUB_REF_NAME" =~ ^${RELEASE_STREAM}-[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
          echo "::error::${RELEASE_STREAM} releases must be built from latest or a ${RELEASE_STREAM}-YYYY.M.D branch, not ${GITHUB_REF_NAME}"
          exit 1
        fi

    - name: Set the release tag
      id: release_tag
      env:
        RELEASE_STREAM: ${{ inputs.release_stream }}
      run: |
        # stable: YYYY-MM-DD, beta and alpha: <stream>-YYYY-MM-DD
        # (the wiki, the clean-up and the release notes use these forms)
        if [[ "$RELEASE_STREAM" == "stable" ]]; then
          HOMEBRIDGE_VM_IMAGE_VERSION="$(date +%Y-%m-%d)"
        else
          HOMEBRIDGE_VM_IMAGE_VERSION="${RELEASE_STREAM}-$(date +%Y-%m-%d)"
        fi
        echo "HOMEBRIDGE_VM_IMAGE_VERSION=${HOMEBRIDGE_VM_IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
        echo "::notice::HOMEBRIDGE_VM_IMAGE_VERSION=${HOMEBRIDGE_VM_IMAGE_VERSION}"
        {
          echo "### Homebridge VM image: ${RELEASE_STREAM}"
          echo
          echo "| Release tag | Branch |"
          echo "|---|---|"
          echo "| \`${HOMEBRIDGE_VM_IMAGE_VERSION}\` | \`${GITHUB_REF_NAME}\` |"
        } >> "$GITHUB_STEP_SUMMARY"

  build-img-file:
    needs: set-versions
    permissions:
      contents: read
    strategy:
      # both CPU types are built at the same time, each on a runner of its own type
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
        include:
          - arch: arm64
            # GitHub has no "latest" label for arm runners: use the newest one
            runs-on: ubuntu-26.04-arm
          - arch: amd64
            runs-on: ubuntu-latest
    runs-on: ${{ matrix.runs-on }}
    env:
      ARCH: ${{ matrix.arch }}
      RELEASE_STREAM: ${{ inputs.release_stream }}
      HOMEBRIDGE_VM_IMAGE_VERSION: ${{ needs.set-versions.outputs.HOMEBRIDGE_VM_IMAGE_VERSION }}
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Setup build environemnt
      - name: Install dependencies
        run: sudo ./scripts/install-build-deps.sh "$ARCH"

      # Step 2: Start the build process
      - name: run build-debian-image.sh script
        id: build
        env:
          # read-only: the build asks GitHub for the checksum of the ffmpeg download
          GH_TOKEN: ${{ github.token }}
        run: |
          ./build-debian-image.sh "$ARCH" "$RELEASE_STREAM" "$HOMEBRIDGE_VM_IMAGE_VERSION"

      # Step 3: Start the image as a virtual machine and check it from the inside.
      # When this step fails, nothing is uploaded and Stage 3 (the release) is never started.
      - name: Boot test
        id: boot-test
        run: |
          # the apt package version the image must hold (npm "2.1.0-beta.4" is apt "2.1.0~beta.4")
          APT_VERSION="$(jq -r '.dependencies["@homebridge/homebridge-apt-pkg"]' "${RELEASE_STREAM}/package.json" | sed -e 's/^\^//' -e 's/-/~/')"
          # the image must also know its own release tag
          sudo ./scripts/boot-test.sh "output/homebridge-vm-image-${RELEASE_STREAM}-${ARCH}.img" "$ARCH" "$HOMEBRIDGE_VM_IMAGE_VERSION" "$APT_VERSION"

      # Step 4: Upload the IMG file as an artifact
      - name: Upload Homebridge Image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          name: homebridge-image-${{ matrix.arch }}
          path: output/*

      - name: Steps complete
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "::notice::Homebridge VM image version: ${HOMEBRIDGE_VM_IMAGE_VERSION}"
          echo "::notice::Run ID: ${RUN_ID}"
          echo "::notice::Architecture: ${ARCH}"
          echo "::notice::Release Stream: ${RELEASE_STREAM}"

      # Written even when a step failed, so the summary shows where the build stopped
      - name: Job summary
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BOOT_OUTCOME: ${{ steps.boot-test.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅ passed" ;; failure) echo "❌ failed" ;; *) echo "⏭️ ${1:-not run}" ;; esac; }
          IMG="output/homebridge-vm-image-${RELEASE_STREAM}-${ARCH}.img"
          SIZE="$( [ -f "$IMG" ] && du -h --apparent-size "$IMG" | cut -f1 || echo "—")"
          APT_PKG="$(jq -r '.dependencies["@homebridge/homebridge-apt-pkg"] // "—"' "${RELEASE_STREAM}/package.json" 2> /dev/null || echo "—")"
          {
            echo "### ${ARCH} image"
            echo
            echo "| Build | Boot test | Image size | homebridge-apt-pkg |"
            echo "|---|---|---|---|"
            echo "| $(icon "$BUILD_OUTCOME") | $(icon "$BOOT_OUTCOME") | ${SIZE} | \`${APT_PKG}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  invoke-package-and-release:
    name: Invoke Stage 3 - Package and Release
    needs: [set-versions, build-img-file]
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout (the local action)
      actions: write  # start the Stage 3 workflow and read its state
    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # This step fails when Stage 3 or a Stage 4 packaging workflow fails.
    - name: Trigger and Wait for ${{ inputs.release_stream }} Stage 3 Workflow
      uses: ./.github/actions/trigger-and-wait-workflow
      with:
        workflow-file: 'release-stage-3_package_release.yml'
        ref: ${{ github.ref_name }}  # stay on the branch that was built
        github-token: ${{ github.token }}
        # Stage 3 also waits for the three Stage 4 packaging workflows
        timeout-minutes: '240'
        workflow-fields: |
          release_stream=${{ inputs.release_stream }}
          run_id=${{ github.run_id }}
          HOMEBRIDGE_VM_IMAGE_VERSION=${{ needs.set-versions.outputs.HOMEBRIDGE_VM_IMAGE_VERSION }}
        run-name: "${{ inputs.release_stream }}:${{ github.run_id }}"
