name: "Cleanup Old Releases and Tags"
description: "Deletes older releases and tags for a given release type, keeping only the latest N."
inputs:
  github-token:
    description: "GitHub token that may delete releases and tags (contents: write)"
    required: true
  release-stream:
    description: "Release type (stable, beta or alpha)"
    required: true
  releases-to-keep:
    description: "Number of releases to keep"
    required: true
runs:
  using: "composite"
  steps:
    - name: Delete Old Releases and Tags
      if: ${{ inputs.release-stream != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_TYPE: ${{ inputs.release-stream }}
        RELEASES_TO_KEEP: ${{ inputs.releases-to-keep }}
      run: |
        echo "::group::Finding releases for $RELEASE_TYPE"
        # old-releases.sh picks by the exact tag form of the stream and keeps the newest ones
        DELETE_TAGS=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | "${GITHUB_ACTION_PATH}/old-releases.sh" "$RELEASE_TYPE" "$RELEASES_TO_KEEP")
        echo "::endgroup::"
        if [[ -z "$DELETE_TAGS" ]]; then
          echo "::notice::No old $RELEASE_TYPE releases to delete."
          exit 0
        fi
        DELETE_COUNT=0
        echo "::group::Deleting old $RELEASE_TYPE releases and tags"
        while read -r TAG; do
          echo "Deleting release and tag: $TAG"
          if gh release delete "$TAG" --cleanup-tag --yes; then
            DELETE_COUNT=$((DELETE_COUNT + 1))
          else
            echo "::warning::Failed to delete $TAG"
          fi
        done <<< "$DELETE_TAGS"
        echo "::notice::$DELETE_COUNT $RELEASE_TYPE releases/tags deleted."
        echo "::endgroup::"
