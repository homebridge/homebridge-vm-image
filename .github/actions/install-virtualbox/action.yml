name: Install VirtualBox
description: Installs VirtualBox on Ubuntu runners using the jammy repo for best compatibility.
runs:
  using: "composite"
  steps:
    - name: apt-get update
      run: |
        echo "::group::Running apt-get update"
        sudo apt-get update
        echo "::endgroup::"
      shell: bash

    - name: Add Oracle VirtualBox repo
      run: |
        echo "::group::Adding Oracle VirtualBox Repository"
        
        # Detect Ubuntu version codename
        UBUNTU_CODENAME=$(lsb_release -cs)
        echo "Detected Ubuntu codename: $UBUNTU_CODENAME"
        
        # Download Oracle's signing key. It is only used when it is the key that is expected:
        # the key is fetched at build time, and apt then trusts everything that key signed.
        ORACLE_KEY_FINGERPRINT="B9F8D658297AF3EFC18D5CDFA2F683C52980AECF"
        KEY_FILE="$(mktemp)"
        wget -q https://www.virtualbox.org/download/oracle_vbox_2016.asc -O "$KEY_FILE"
        FOUND_FINGERPRINT="$(gpg --show-keys --with-colons "$KEY_FILE" | awk -F: '$1 == "fpr" { print $10; exit }')"
        if [[ "$FOUND_FINGERPRINT" != "$ORACLE_KEY_FINGERPRINT" ]]; then
          echo "::error::The VirtualBox signing key has fingerprint '${FOUND_FINGERPRINT}', expected '${ORACLE_KEY_FINGERPRINT}'"
          exit 1
        fi
        sudo gpg --dearmor -o /usr/share/keyrings/oracle_vbox_2016.gpg < "$KEY_FILE"
        rm -f "$KEY_FILE"
        
        # Add VirtualBox repository with detected Ubuntu version
        echo "deb [signed-by=/usr/share/keyrings/oracle_vbox_2016.gpg] https://download.virtualbox.org/virtualbox/debian $UBUNTU_CODENAME contrib" | sudo tee /etc/apt/sources.list.d/virtualbox.list
        
        sudo apt-get update
        echo "::endgroup::"
      shell: bash

    - name: Install VirtualBox
      run: |
        echo "::group::Installing VirtualBox"
        sudo apt-get install -y virtualbox-7.2 
        echo "::endgroup::"
      shell: bash

    - name: Install qemu-utils
      run: |
        echo "::group::Installing qemu-utils"
        sudo apt-get install -y qemu-utils
        echo "::endgroup::"
      shell: bash

    - name: VirtualBox Version
      run: |
        vboxmanage --version
      shell: bash
